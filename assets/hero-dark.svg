<svg xmlns="http://www.w3.org/2000/svg" width="840" height="316" viewBox="0 0 840 316" role="img" aria-labelledby="title">
<title id="title">Chief Technology Officer @ Crystallize. Driving Innovation and accelerating growth through AI-Augmented Tech Leadership.</title>
<defs>
    <style>
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 50% { opacity: .35; } }
    .rise { animation: rise .6s ease-out both; }
    .blink { animation: blink 1.1s step-end infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
        .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
        .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
    <radialGradient id="glow" cx="88%" cy="0%" r="70%">
        <stop offset="0" stop-color="#995700" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#995700" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#737373" fill-opacity=".35"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
        <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade-mask"><rect width="840" height="316" fill="url(#fade)"/></mask>
    <clipPath id="frame"><rect width="840" height="316" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
    <rect width="840" height="316" fill="#171717"/>
    <rect width="840" height="316" fill="url(#dots)" mask="url(#fade-mask)"/>
    <rect width="840" height="316" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="839" height="315" rx="16" fill="none" stroke="#404040"/>

<circle class="pulse" cx="45" cy="49" r="5" fill="#ff9900"/>
<text class="sans rise" x="60" y="54" font-size="15" fill="#a3a3a3">Chief Technology Officer @ <tspan fill="#ffffff" font-weight="600">Crystallize</tspan></text>
<text class="mono rise" x="800" y="54" text-anchor="end" font-size="12" fill="#737373" style="animation-delay:0.10s">sebastien.morel.me ↗</text>

<text class="sans rise" x="40" y="132" font-size="40" font-weight="600" letter-spacing="-1.2" fill="#ffffff" style="animation-delay:0.20s">Driving Innovation and</text>
<text class="sans rise" x="40" y="178" font-size="40" font-weight="600" letter-spacing="-1.2" fill="#ffffff" style="animation-delay:0.30s">accelerating growth through</text>
<text class="sans rise" x="40" y="224" font-size="40" font-weight="600" letter-spacing="-1.2" fill="#ffffff" style="animation-delay:0.40s">AI-Augmented Tech Leadership.</text>
<text class="mono rise" x="40" y="276" font-size="14" fill="#ffa533" style="animation-delay:0.60s"><tspan>Agentic Systems</tspan><tspan fill="#737373"> · </tspan><tspan>Evals</tspan><tspan fill="#737373"> · </tspan><tspan>Distributed APIs</tspan><tspan fill="#737373"> · </tspan><tspan>Developer Platforms</tspan><tspan class="blink" fill="#ff9900"> ▍</tspan></text>
</svg>
